<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <!-- White Background -->
  <rect width="480" height="120" fill="#FFFFFF"/>

  <!-- Logo Mark Group -->
  <g id="junzle-icon" transform="translate(24, 12)">
    <!-- Speed lines sweeping from bottom-left -->
    <!-- Speed line 1 (Yellow, lower) -->
    <path d="M 4 82 L 28 82 L 24 88 L 0 88 Z" fill="#FFEF00" />
    <path d="M 12 72 L 34 72 L 30 77 L 8 77 Z" fill="#1A56DB" />
    <path d="M 22 62 L 38 62 L 35 66 L 19 66 Z" fill="#FFEF00" />

    <!-- Single Bold Italic J Base in Royal Blue (#1A56DB) -->
    <!-- Slanted athletic geometry -->
    <g transform="skewX(-13) translate(18, 0)">
      <!-- J Main Body (Royal Blue) -->
      <!-- Top bar and outer hook -->
      <path d="
        M 42 12
        L 86 12
        L 83 26
        L 68 26
        L 62 50
        L 52 50
        L 56 36
        L 56 26
        L 42 26
        Z
      " fill="#1A56DB" />

      <!-- J Stem & Bottom Loop with Integrated Negative Space Cut -->
      <!-- Upper Stem -->
      <path d="
        M 68 26
        L 83 26
        L 77 48
        L 63 48
        Z
      " fill="#1A56DB" />

      <!-- Lower Stem & Curve -->
      <path d="
        M 60 58
        L 74 58
        L 70 70
        C 68 79, 60 86, 48 86
        C 35 86, 26 78, 28 66
        L 41 66
        C 40 71, 44 74, 49 74
        C 54 74, 58 71, 59 66
        Z
      " fill="#1A56DB" />

      <!-- Canary Yellow Lightning Bolt / Slash negative space cut integrated on right flank -->
      <polygon points="61,46 79,46 67,58 77,58 57,80 63,60 55,60" fill="#FFEF00" />
    </g>
  </g>

  <!-- Wordmark: "Junzle" in bold italic sans-serif -->
  <text x="148" y="78" 
        font-family="Montserrat, 'Segoe UI', Inter, -apple-system, sans-serif" 
        font-size="54" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="-1px" 
        fill="#0D1B3E">
    Junzle
  </text>

  <!-- Canary Yellow accent dot on top of "e" or subtle athletic speed slash at wordmark baseline -->
  <rect x="338" y="80" width="22" height="4" rx="2" transform="skewX(-14)" fill="#FFEF00" />
</svg>
