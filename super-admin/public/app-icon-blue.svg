<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Royal Blue (#1A56DB) Rounded Square (iOS App Icon Format) -->
  <rect width="512" height="512" rx="115" fill="#1A56DB"/>

  <!-- Centered Icon Elements -->
  <g transform="translate(90, 80)">
    <!-- Dynamic Speed Lines sweeping from bottom left -->
    <path d="M 10 290 L 90 290 L 76 308 L -4 308 Z" fill="#FFEF00" />
    <path d="M 32 258 L 108 258 L 94 274 L 18 274 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M 64 226 L 122 226 L 110 240 L 52 240 Z" fill="#FFEF00" />

    <!-- Slanted Single Bold Italic J (White body for maximum high-contrast visibility on Royal Blue) -->
    <g transform="skewX(-13) translate(50, 0)">
      <!-- J Top Crossbar -->
      <path d="
        M 105 40
        L 235 40
        L 225 80
        L 182 80
        L 165 150
        L 135 150
        L 147 110
        L 147 80
        L 105 80
        Z
      " fill="#FFFFFF" />

      <!-- J Upper Stem -->
      <path d="
        M 182 80
        L 225 80
        L 207 146
        L 165 146
        Z
      " fill="#FFFFFF" />

      <!-- J Lower Stem & Curved Hook -->
      <path d="
        M 156 178
        L 198 178
        L 186 216
        C 180 244, 156 266, 120 266
        C 80 266, 54 242, 60 206
        L 98 206
        C 95 220, 107 230, 122 230
        C 137 230, 149 221, 152 206
        Z
      " fill="#FFFFFF" />

      <!-- Canary Yellow (#FFEF00) Negative Space Lightning Bolt / Slash integrated cut -->
      <polygon points="160,140 214,140 178,176 208,176 150,244 168,184 144,184" fill="#FFEF00" />
    </g>
  </g>
</svg>
